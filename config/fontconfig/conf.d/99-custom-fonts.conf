<fontconfig>
  <!-- Prefer Inter for generic sans-serif text -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Prefer Source Code Pro for monospace text -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Source Code Pro</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Prefer Noto Serif for generic serif text -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
    </prefer>
  </alias>
</fontconfig>

