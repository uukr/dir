[main]
font=Source Code Pro:size=12
prompt=""
icon-theme=Papirus-Dark
icons-enabled=yes
fields=name,generic,comment,categories,filename
terminal=alacritty
layer=overlay
width=45
lines=10
horizontal-pad=24
vertical-pad=0
inner-pad=0
letter-spacing=0
line-height=32
image-size-ratio=0.5
exit-on-keyboard-focus-loss=yes

[border]
width=0
radius=0

[colors]
background=111111dd
text=cdd6f4ff
match=cba6f7ff
selection=333333ee
selection-text=cdd6f4ff
selection-match=f5c2e7ff
border=cba6f700
counter=6c7086ff

[dmenu]
exit-immediately-if-empty=yes
